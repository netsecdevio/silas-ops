# Daily package and lock updates. Managed org-wide; see netsecdevio/.github.
#
# Updates are grouped so a day produces a few reviewable PRs rather than
# dozens. Major bumps stay separate because they need a human decision.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/packages/paperclip-runner/runner"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
      - "/docker/agent-runtime"
      - "/docker/daytona-runner"
      - "/docker/hermes-gateway-smoke"
      - "/docker/openclaw-smoke"
      - "/docker/untrusted-review"
      - "/packages/plugins/sandbox-providers/cloudflare/bridge-template"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "gomod"
    directories:
      - "/tools/agent-shim"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      gomod-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/plugins/sandbox-providers/daytona"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
